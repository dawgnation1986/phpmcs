# PHPMCS 1.8.9 - 服务端配置
# 改完要重启服务端才生效

# 监听端口。改这里的话 start.ps1 里的 $Port 也要一起改
server-port=25565

# 显示在服务器列表里的名字
motd=PHP 写的 1.8.9 - 新的世界

# 存档目录名（相对项目根）
level-name=world

# 0=生存 1=创造 2=冒险 3=旁观
gamemode=1

# 0=和平 1=简单 2=普通 3=困难
difficulty=1

# 同时在线人数上限
max-players=20

# 视距（区块）。越大内存和带宽吃得越多，4 以上会明显卡
view-distance=3

# 出生点保护区半径（格）
spawn-protection=16

# 正版验证。这个服务端只支持离线模式，保持 false
online-mode=false

# 允许飞行（创造模式外）
allow-flight=false

# 是否生成建筑（村庄/要塞等，目前未实现，预留）
generate-structures=true

# 世界类型
level-type=DEFAULT

# 是否开启命令方块
enable-command-block=false

# 玩家闲置多久踢出（分钟），0=不踢
player-idle-timeout=0
